repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff check
        entry: make -C lab_1 lint
        language: system
        pass_filenames: false
        files: ^lab_1/
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        entry: make -C lab_1 format-check
        language: system
        pass_filenames: false
        files: ^lab_1/
        stages: [pre-commit]
      - id: pyright
        name: pyright
        entry: make -C lab_1 typecheck
        language: system
        pass_filenames: false
        files: ^lab_1/
        stages: [pre-push]
